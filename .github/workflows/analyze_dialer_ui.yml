name: Analyze Google Phone call-recording UI

on:
  push:
    branches:
      - custom
    paths:
      - '.github/workflows/analyze_dialer_ui.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download JADX
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Download Google Phone 161
        run: |
          curl -fL --retry 3 https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu -o apkeep
          chmod +x apkeep
          mkdir apk-out
          ./apkeep -a "com.google.android.dialer@161.0.726587057-downloadable" -o "arch=arm64-v8a" apk-out
          APK="$(find apk-out -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" google-phone-161.apk

      - name: Decompile and trace call-recording UI
        run: |
          mkdir -p ui-analysis
          jadx/bin/jadx --no-res -d jadx-original google-phone-161.apk > ui-analysis/jadx.log 2>&1 || true

          GSM_FILE="$(grep -Rl --include='*.java' 'Call recording is disabled in the current country' jadx-original/sources | head -n 1)"
          test -n "$GSM_FILE"
          GSM_CLASS="$(basename "$GSM_FILE" .java)"
          echo "CanRecord obfuscated class: $GSM_CLASS" | tee ui-analysis/summary.txt

          CALL_RECORDING_IMPL_FILE="$(grep -Rl --include='*.java' 'com/android/dialer/callrecording/impl/CallRecordingImpl' jadx-original/sources | head -n 1)"
          test -n "$CALL_RECORDING_IMPL_FILE"
          CALL_RECORDING_IMPL_CLASS="$(basename "$CALL_RECORDING_IMPL_FILE" .java)"
          echo "CallRecordingImpl obfuscated class: $CALL_RECORDING_IMPL_CLASS" | tee -a ui-analysis/summary.txt

          mkdir -p ui-analysis/consumers
          cp jadx-original/sources/defpackage/grx.java ui-analysis/consumers/defpackage__grx.java
          grep -Rl --include='*.java' -E "\\b${GSM_CLASS}\\b|\\b${CALL_RECORDING_IMPL_CLASS}\\b|\\bgrx\\b|CallRecordingButtonController|BOUNCE_CALL_RECORDING_BUTTON|call recording clicked" jadx-original/sources |
            sort -u |
            while read -r file; do
              cp "$file" "ui-analysis/consumers/$(echo "$file" | sed 's#jadx-original/sources/##; s#/#__#g')"
            done

          {
            echo "=== Direct CanRecord consumers ==="
            grep -R -n -C 50 --include='*.java' -E "\\b${GSM_CLASS}\\b" jadx-original/sources || true
            echo
            echo "=== Direct CallRecordingImpl consumers ==="
            grep -R -n -C 70 --include='*.java' -E "\\b${CALL_RECORDING_IMPL_CLASS}\\b" jadx-original/sources || true
            echo
            echo "=== Call recording button/controller references ==="
            grep -R -n -C 50 --include='*.java' -E 'CallRecordingButtonController|BOUNCE_CALL_RECORDING_BUTTON|CALL_RECORDING_BUTTON|call recording clicked|call_recording' jadx-original/sources || true
          } > ui-analysis/trace.txt

      - name: Upload UI analysis
        uses: actions/upload-artifact@v4
        with:
          name: dialer-call-recording-ui-analysis
          path: ui-analysis/
