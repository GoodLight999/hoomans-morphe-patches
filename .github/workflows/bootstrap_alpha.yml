name: Bootstrap Alpha Version

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, '[bootstrap-alpha]')
    runs-on: ubuntu-latest
    env:
      VERSION: 1.53.1-alpha.1
      TAG: v1.53.1-alpha.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build alpha bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion="$VERSION" :patches:buildAndroid --no-daemon

      - name: Replace incorrect bootstrap release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-alpha.1 --cleanup-tag --yes || true
          ASSET="$(find patches/build/libs -maxdepth 1 -type f -name "patches-${VERSION}.mpp" | head -n 1)"
          test -n "$ASSET"
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target dev \
            --prerelease \
            --title "$TAG" \
            --notes "GoodLight999 alpha channel. Includes Silent call recording (GoodLight999) with GL999CallRec runtime diagnostics."

      - name: Write Morphe remote metadata
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          metadata = {
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", ""),
              "description": "GoodLight999 alpha channel. Silent call recording includes GL999CallRec runtime diagnostics.",
              "download_url": f"https://github.com/{repo}/releases/download/v{version}/patches-{version}.mpp",
              "signature_download_url": "",
              "version": version,
          }
          Path("patches-bundle.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit alpha metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: bootstrap v${VERSION} alpha metadata [skip ci]" || exit 0
          git push origin HEAD:dev
