name: Feature build

on:
  push:
    branches:
      - feat/silent-call-recording
  pull_request:
    branches:
      - feat/silent-call-recording

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Download Morphe Desktop
        run: |
          curl -fL --retry 3             https://github.com/MorpheApp/morphe-desktop/releases/download/v1.17.0/morphe-desktop-1.17.0-all.jar             -o morphe-desktop.jar

      - name: Download Google Phone 161
        run: |
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://d.apkpure.com/b/APK/com.google.android.dialer?versionCode=18308983"             -o google-phone-161.apk
          file google-phone-161.apk
          unzip -t google-phone-161.apk >/dev/null

      - name: Apply silent recording patch
        run: |
          PATCH_BUNDLE="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$PATCH_BUNDLE"
          java -jar morphe-desktop.jar patch             -p "$PATCH_BUNDLE"             --exclusive             -e "Silence call recording announcements"             --unsigned             -o google-phone-161-patched.apk             google-phone-161.apk
          unzip -t google-phone-161-patched.apk >/dev/null
