name: Feature build

on:
  push:
    branches:
      - feat/silent-call-recording
      - custom
  pull_request:
    branches:
      - feat/silent-call-recording
      - custom

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: GoodLight999-morphe-patches
          path: |
            patches/build/libs/*.mpp
            !patches/build/libs/*-sources.mpp
            !patches/build/libs/*-javadoc.mpp

      - name: Download Morphe Desktop
        run: curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.17.0/morphe-desktop-1.17.0-all.jar -o morphe-desktop.jar

      - name: Install audio verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download JADX
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Download Google Phone 161
        run: |
          curl -fL --retry 3 https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu -o apkeep
          chmod +x apkeep
          mkdir apk-out
          ./apkeep -a "com.google.android.dialer@161.0.726587057-downloadable" -o "arch=arm64-v8a" apk-out
          APK="$(find apk-out -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" google-phone-161.apk
          file google-phone-161.apk
          unzip -t google-phone-161.apk >/dev/null
          echo "APK_SHA256=$(sha256sum google-phone-161.apk | cut -d' ' -f1)"
          echo "APK_SIZE=$(stat -c%s google-phone-161.apk)"

      - name: Inspect original recording paths
        run: |
          mkdir -p static-analysis
          jadx/bin/jadx --no-res -d jadx-original google-phone-161.apk > static-analysis/jadx-original.log 2>&1 || true
          {
            echo "=== Recording announcement resource references ==="
            grep -R -n -C 10 -E 'call_recording_(starting|ending|speaker_starting|speaker_ending)_voice' jadx-original/sources || true
            echo
            echo "=== Prompt-file references ==="
            grep -R -n -C 10 -E 'callrecordingprompt|starting_voice|ending_voice' jadx-original/sources || true
            echo
            echo "=== TTS/audio API references near Dialer code ==="
            grep -R -n -C 6 -E 'synthesizeToFile|TextToSpeech|ToneGenerator|SoundPool' jadx-original/sources/com/google/android/dialer jadx-original/sources 2>/dev/null | head -n 6000 || true
          } > static-analysis/original-recording-paths.txt

          mkdir -p static-analysis/call-recording-availability
          while IFS= read -r src; do
            [ -f "$src" ] || continue
            cp "$src" "static-analysis/call-recording-availability/$(basename "$src")"
          done < <(
            grep -Rl --include='*.java' -E \
              'Call recording is disabled in the current country|G__enable_call_recording|enable_call_recording_system_feature|G__call_recording_force_enable_device_models|CallRecordingDataSourceStatus|CallRecordingButtonController|isCallRecordingCountry|call recording is not available|call recording.*available|recording.*button' \
              jadx-original/sources 2>/dev/null | sort -u
          )

          {
            echo "=== Call recording availability / UI gates ==="
            grep -R -n -C 25 -E \
              'Call recording is disabled in the current country|G__enable_call_recording|enable_call_recording_system_feature|G__call_recording_force_enable_device_models|CallRecordingDataSourceStatus|isCallRecordingCountry|call recording is not available|call recording.*available|recording.*button' \
              jadx-original/sources 2>/dev/null | head -n 12000 || true
          } > static-analysis/call-recording-availability.txt

          {
            echo "=== Disclosure implementations / construction ==="
            grep -R -n -C 14 -E 'new (grr|gro|gru)\(' jadx-original/sources || true
            echo
            echo "=== Call-recording disclosure audio injection ==="
            grep -R -n -C 14 -E 'TtsCallRecordingDisclosure|BeepSoundCallRecordingDisclosure|BuiltIn.*CallRecordingDisclosure|CALL_RECORDING_DISCLOSURE_' jadx-original/sources || true
            echo
            echo "=== Disclosure type selection ==="
            grep -R -n -C 24 -E 'grm\.(BEEP_SOUND|TTS|BUILT_IN)|grm\.b\(' jadx-original/sources || true
          } > static-analysis/disclosure-control-flow.txt

          mapfile -t DISCLOSURE_SELECTOR_FILES < <(
            grep -Rl --include='*.java' -E 'grm\.(BEEP_SOUND|TTS|BUILT_IN)' jadx-original/sources 2>/dev/null || true
          )
          mkdir -p static-analysis/disclosure-selectors
          for src in "${DISCLOSURE_SELECTOR_FILES[@]}"; do
            cp "$src" "static-analysis/disclosure-selectors/$(basename "$src")"
          done

          for class in grn grj grp grr grs grw grt gro gru grl grv gry gty gib fii gte gkn fiy fiz fis fjo fjq fir fij fif mom fja fjs adf; do
            src="jadx-original/sources/defpackage/$class.java"
            if [ -f "$src" ]; then
              cp "$src" "static-analysis/$class.java"
            fi
          done

      - name: Apply silent recording patch
        run: |
          PATCH_BUNDLE="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$PATCH_BUNDLE"
          java -jar morphe-desktop.jar patch -p "$PATCH_BUNDLE" --exclusive -e "Silent call recording (GoodLight999)" --unsigned -o google-phone-161-patched.apk google-phone-161.apk
          unzip -t google-phone-161-patched.apk >/dev/null

      - name: Verify patched announcement resources
        run: |
          jadx/bin/jadx --no-src -d jadx-patched google-phone-161-patched.apk > static-analysis/jadx-patched.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = {
              "call_recording_starting_voice",
              "call_recording_ending_voice",
              "call_recording_speaker_starting_voice",
              "call_recording_speaker_ending_voice",
          }
          found = {}
          for path in Path("jadx-patched/resources/res").glob("values*/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for elem in root:
                  name = elem.attrib.get("name")
                  if name not in names:
                      continue
                  if elem.tag == "string" or (elem.tag == "item" and elem.attrib.get("type") == "string"):
                      found.setdefault(name, []).append((str(path), elem.text or ""))

          required = {"call_recording_starting_voice", "call_recording_ending_voice"}
          missing = required - found.keys()
          if missing:
              raise SystemExit(f"Missing required patched resources: {sorted(missing)}")

          nonempty = {
              name: entries
              for name, entries in found.items()
              if any(value != "" for _, value in entries)
          }
          if nonempty:
              raise SystemExit(f"Announcement resources are not empty: {nonempty}")

          raw_names = {
              "starting_voice_beep_sound.ogg",
              "ending_voice_beep_sound.ogg",
              "starting_voice_ar_XA.m4a",
              "ending_voice_ar_XA.m4a",
              "starting_voice_my_MM.m4a",
              "ending_voice_my_MM.m4a",
          }

          import subprocess
          raw_dir = Path("jadx-patched/resources/res/raw")
          raw_results = {}
          for name in sorted(raw_names):
              path = raw_dir / name
              if not path.is_file():
                  raise SystemExit(f"Missing patched raw announcement resource: {name}")

              decoded = subprocess.run(
                  [
                      "ffmpeg", "-v", "error", "-i", str(path),
                      "-f", "s16le", "-ac", "1", "-ar", "8000", "pipe:1",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              if not decoded:
                  raise SystemExit(f"Patched raw announcement resource decodes to no audio: {name}")
              if any(decoded):
                  raise SystemExit(f"Patched raw announcement resource is not silent: {name}")
              raw_results[name] = len(decoded)

          with open("static-analysis/patched-resource-verification.txt", "w", encoding="utf-8") as out:
              for name in sorted(found):
                  out.write(f"{name}: {len(found[name])} definitions; all empty\n")
              for name in sorted(raw_results):
                  out.write(f"{name}: decoded PCM is completely silent ({raw_results[name]} bytes checked)\n")
          PY

      - name: Verify patched disclosure cache invalidation
        run: |
          jadx/bin/jadx --no-res -d jadx-patched-src google-phone-161-patched.apk > static-analysis/jadx-patched-src.log 2>&1 || true

          mapfile -t CACHE_HOSTS < <(
            grep -Rl --include='*.java' '"callrecordingprompt"' jadx-patched-src/sources 2>/dev/null | while read -r file; do
              if grep -q '"audioinjector"' "$file"; then
                echo "$file"
              fi
            done
          )
          if [ "${#CACHE_HOSTS[@]}" -ne 1 ]; then
            echo "Expected one patched disclosure cache host, found ${#CACHE_HOSTS[@]}" >&2
            printf '%s\n' "${CACHE_HOSTS[@]}" >&2
            exit 1
          fi

          CACHE_HOST="${CACHE_HOSTS[0]}"
          cp "$CACHE_HOST" static-analysis/patched-cache-host.java
          DELETE_COUNT="$(grep -c '\.delete()' "$CACHE_HOST" || true)"
          if [ "$DELETE_COUNT" -ne 2 ]; then
            echo "Expected two cached disclosure file deletions, found $DELETE_COUNT" >&2
            grep -n -C 8 -E 'audioinjector|callrecordingprompt|\.delete\(\)' "$CACHE_HOST" >&2 || true
            exit 1
          fi

          grep -n -C 12 -E 'audioinjector|callrecordingprompt|\.delete\(\)' "$CACHE_HOST" > static-analysis/patched-cache-verification.txt

          mapfile -t DISCLOSURE_ENUMS < <(
            grep -Rl --include='*.java' 'CALL_RECORDING_DISCLOSURE_TYPE_UNSPECIFIED' jadx-patched-src/sources 2>/dev/null | while read -r file; do
              if grep -q 'public enum' "$file" && grep -q 'BEEP_SOUND' "$file" && grep -q 'BUILT_IN' "$file" && grep -q 'TTS' "$file"; then
                echo "$file"
              fi
            done
          )
          if [ "${#DISCLOSURE_ENUMS[@]}" -ne 1 ]; then
            echo "Expected one patched disclosure enum, found ${#DISCLOSURE_ENUMS[@]}" >&2
            printf '%s\n' "${DISCLOSURE_ENUMS[@]}" >&2
            exit 1
          fi

          DISCLOSURE_ENUM="${DISCLOSURE_ENUMS[0]}"
          cp "$DISCLOSURE_ENUM" static-analysis/patched-disclosure-enum.java
          python3 - "$DISCLOSURE_ENUM" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          match = re.search(
              r"public static\s+\w+\s+\w+\(int\s+(\w+)\)\s*\{",
              source,
          )
          if not match:
              raise SystemExit("Disclosure int->enum decoder not found in patched source")

          parameter = match.group(1)
          tail = source[match.end():]
          first_lines = "\\n".join(tail.splitlines()[:14])
          assignment = re.search(rf"\b{re.escape(parameter)}\s*=\s*1\s*;", first_lines)
          direct_return = re.match(r"\s*return\s+BEEP_SOUND\s*;", tail)
          folded_beep_branch = re.search(
              r"if\s*\(\s*1\s*==\s*1\s*\)\s*\{\s*return\s+BEEP_SOUND\s*;",
              tail,
              re.S,
          )
          if not assignment and not direct_return and not folded_beep_branch:
              raise SystemExit(
                  "Disclosure decoder input is not visibly forced to beep value 1:\\n" + first_lines
              )

          Path("static-analysis/patched-disclosure-type-verification.txt").write_text(
              f"decoder parameter={parameter}\\n" + first_lines + "\\n",
              encoding="utf-8",
          )
          PY

          BEEP_GATE="jadx-patched-src/sources/defpackage/grv.java"
          if [ ! -f "$BEEP_GATE" ]; then
            echo "Patched beep disclosure gate class grv.java not found" >&2
            exit 1
          fi
          cp "$BEEP_GATE" static-analysis/patched-beep-disclosure-gate.java
          if ! grep -q 'return true;' "$BEEP_GATE"; then
            echo "Beep disclosure geofence is not forced enabled" >&2
            sed -n '1,120p' "$BEEP_GATE" >&2
            exit 1
          fi
          grep -n -C 8 'return true;' "$BEEP_GATE" > static-analysis/patched-beep-geofence-verification.txt

          DEBUG_CLASS="jadx-patched-src/sources/app/morphe/extension/dialer/callrecording/DebugLog.java"
          if [ ! -f "$DEBUG_CLASS" ]; then
            echo "GoodLight999 runtime diagnostic class was not merged into the patched APK" >&2
            exit 1
          fi
          if ! grep -q 'GL999CallRec' "$DEBUG_CLASS"; then
            echo "GL999CallRec diagnostic tag missing from merged extension" >&2
            exit 1
          fi
          cp "$DEBUG_CLASS" static-analysis/DebugLog.java

          for marker in \
            canRecordGateBypassed \
            disclosureForcedToBeep \
            beepGeofenceBypassed \
            cachedDisclosureInvalidated \
            startingAudioCompleted \
            startingAudioFailed \
            recordingEngineStartRequested
          do
            if ! grep -R -q --include='*.java' "$marker" jadx-patched-src/sources; then
              echo "Runtime diagnostic call missing after patching: $marker" >&2
              exit 1
            fi
          done

          grep -R -n -C 5 --include='*.java' -E \
            'startingAudioCompleted|startingAudioFailed|recordingEngineStartRequested' \
            jadx-patched-src/sources > static-analysis/patched-runtime-diagnostics.txt

      - name: Upload static analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-recording-static-analysis
          path: static-analysis/
